<!DOCTYPE html>
<html>
<head>
    <title>Mock Job Board</title>
</head>
<body>
    <h1>Full Stack Developer</h1>
    <h2 class="company-name">SpaceX Pune Labs</h2>
    <div class="location">Pune, India</div>
    <div class="description">
        We are looking for a Software Engineer proficient in React, Node.js, and Redis caching. Experience with AI prompts is a huge plus.
    </div>
    <form>
        <label>Full Name <input type="text" id="fullname" name="candidate_name" /></label>
        <label>Email Address <input type="email" id="email" name="candidate_email" /></label>
        <button type="submit">Apply Now</button>
    </form>
</body>
</html>
